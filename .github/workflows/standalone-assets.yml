name: standalone-assets

on:
  push:
    branches: ["release-please--**"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The asset commit below is pushed with a PAT and would re-trigger this
    # workflow; skip runs caused by our own commit to break the loop.
    if: "github.event.head_commit.message != 'chore: build standalone assets'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npm run versions:sync

      - run: npm install --package-lock-only --ignore-scripts

      - run: npm run build:standalone

      - name: Commit refreshed standalone assets
        run: |
          if [ -n "$(git status --porcelain package.json package-lock.json packages)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json packages/*/package.json packages/framework/dist-standalone packages/api-reference/dist-standalone packages/calendar/dist packages/chat/dist packages/media/dist packages/search/dist packages/tree/dist
            git commit -m "chore: build standalone assets"
            git push
          fi
