name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  js-static:
    name: JS Static (format, lint, types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npm run format:check

      - run: npm run lint:github

      - run: npm run typecheck

      - run: npm run type-coverage

  vitest:
    name: Vitest (jsdom coverage)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: |
          mkdir -p coverage_vitest
          npm run test:coverage -- --project jsdom --reporter=default --reporter=junit --outputFile.junit=coverage_vitest/junit.xml

      - name: Upload Vitest coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: coverage_vitest/lcov.info
          flags: vitest
          name: vitest
          disable_search: true
          fail_ci_if_error: true

      - name: Upload Vitest test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: coverage_vitest/junit.xml
          flags: vitest
          name: vitest-tests
          report_type: test_results
          disable_search: true
          fail_ci_if_error: true

  vitest-browser:
    name: Vitest Browser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browser and system deps
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: |
          mkdir -p coverage_vitest
          npm run test:coverage -- --project browser --reporter=default --reporter=junit --outputFile.junit=coverage_vitest/browser-junit.xml

      - name: Upload Vitest browser coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: coverage_vitest/lcov.info
          flags: vitest-browser
          name: vitest-browser
          disable_search: true
          fail_ci_if_error: true

      - name: Upload Vitest browser test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: coverage_vitest/browser-junit.xml
          flags: vitest-browser
          name: vitest-browser-tests
          report_type: test_results
          disable_search: true
          fail_ci_if_error: true

  build-lib:
    name: Library Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npm run build:lib

      - run: npm run check:package

      - run: npm run build:standalone

  bundle-analysis:
    name: Workbench Bundle Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Upload workbench bundle analysis to Codecov
        env:
          CODECOV_BUNDLE: "1"
        run: npm run build

      - name: Icons are up to date
        run: |
          npm run build:sprite --workspace @lattice-php/api-reference
          git diff --exit-code -- packages/ui/resources/icons packages/ui/src/Enums/Icon.php workbench/resources/js/sprite-icons.ts packages/api-reference/resources/js/icons/sprite.generated.ts

  package-install:
    name: Package installs standalone (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [action, core, form, framework, search, table, tree, ui]
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      # Each package must be installable on its own — the monorepo's shared
      # vendor dir masks missing dependency declarations, and an unresolvable
      # manifest only surfaces after the split repos are tagged. Siblings come
      # from path repositories with a stamped version so `self.version`
      # constraints resolve against the PR's state, not yesterday's release.
      - name: Install the package standalone
        working-directory: packages/${{ matrix.package }}
        run: |
          for manifest in ../*/composer.json; do
            jq '.version = "0.99.0"' "$manifest" > "$manifest.tmp" && mv "$manifest.tmp" "$manifest"
          done
          composer config repositories.siblings '{"type":"path","url":"../*","options":{"symlink":true}}'
          composer update --no-interaction --no-progress --prefer-dist

      - name: Provider class is autoloadable
        working-directory: packages/${{ matrix.package }}
        run: |
          provider=$(jq -r '.extra.laravel.providers[0]' composer.json)
          php -r "require 'vendor/autoload.php'; exit(class_exists('$provider') ? 0 : 1);"

  php-static:
    name: PHP Static (pint, phpstan, rector)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Resolve composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-8.4-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-${{ runner.os }}-8.4-

      - run: composer install --prefer-dist --no-progress --no-interaction

      - name: Pint (style check)
        run: composer test:lint

      - name: PHPStan
        run: composer analyse

      - name: Rector (dry-run)
        run: composer rector:test

  generated-types:
    name: Generated TypeScript Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Resolve composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-8.4-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-${{ runner.os }}-8.4-

      - run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generated TypeScript types are up to date
        run: |
          composer types
          git add --intent-to-add \
            packages/framework/resources/js/types/generated.ts \
            packages/form/resources/js/generated.ts \
            packages/table/resources/js/generated.ts \
            packages/action/resources/js/generated.ts \
            packages/ui/resources/js/generated.ts
          git diff --exit-code -- \
            packages/framework/resources/js/types/generated.ts \
            packages/form/resources/js/generated.ts \
            packages/table/resources/js/generated.ts \
            packages/action/resources/js/generated.ts \
            packages/ui/resources/js/generated.ts

  php-tests:
    name: PHP Tests (${{ matrix.php-version }}, ${{ matrix.coverage }}${{ matrix.shard && format(', shard {0}/2', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: "8.4"
            coverage: pcov
            shard: 1
          - php-version: "8.4"
            coverage: pcov
            shard: 2
          - php-version: "8.5"
            coverage: none
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: ${{ matrix.coverage }}
          # The coverage source is packages/ only (phpunit.xml); instrumenting
          # the whole workspace makes pcov also trace vendor/ and workbench/.
          ini-values: pcov.directory=packages
          tools: composer:v2

      - name: Resolve composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php-version }}-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php-version }}-

      - run: composer install --prefer-dist --no-progress --no-interaction

      - name: Pest (parallel)
        if: ${{ matrix.php-version != '8.4' }}
        run: composer test:parallel

      - name: Pest with coverage
        if: ${{ matrix.php-version == '8.4' }}
        run: composer test:coverage -- --shard=${{ matrix.shard }}/2

      - name: Upload Pest coverage to Codecov
        if: ${{ !cancelled() && matrix.php-version == '8.4' }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: coverage_phpunit/clover.xml
          flags: pest
          name: pest-${{ matrix.shard }}
          disable_search: true
          fail_ci_if_error: true

      - name: Upload Pest test results to Codecov
        if: ${{ !cancelled() && matrix.php-version == '8.4' }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: coverage_phpunit/pest.junit.xml
          flags: pest
          name: pest-tests-${{ matrix.shard }}
          report_type: test_results
          disable_search: true
          fail_ci_if_error: true

      - name: Docs fixtures are up to date
        if: ${{ matrix.php-version == '8.4' }}
        run: |
          git add --intent-to-add docs/fixtures
          git diff --exit-code docs/fixtures
