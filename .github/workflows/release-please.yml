name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          # A PAT (not the default GITHUB_TOKEN) so the PRs release-please opens
          # trigger CI — GitHub suppresses workflow runs for GITHUB_TOKEN events.
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - run: npm run versions:check

      # `files` includes dist-standalone, but `npm pack` silently skips missing
      # entries — without this gate a tag whose asset commit never landed would
      # publish a package with no standalone assets.
      - run: npm run verify:standalone

      - run: npm publish --workspaces --include-workspace-root --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  split-composer:
    needs: release-please
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - directory: packages/core
            repository: core
          - directory: packages/form
            repository: form
          - directory: packages/table
            repository: table
          - directory: packages/ui
            repository: ui
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: danharrin/monorepo-split-github-action@v2.4.0
        with:
          package_directory: ${{ matrix.package.directory }}
          repository_organization: lattice-php
          repository_name: ${{ matrix.package.repository }}
          tag: ${{ needs.release-please.outputs.tag_name }}
          user_email: github-actions[bot]@users.noreply.github.com
          user_name: github-actions[bot]
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
